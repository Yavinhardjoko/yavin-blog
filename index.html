
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Selamat datang di Yavin Blog.">
  <title>Yavin Blog</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080b10;
      color: #eef3fa;
      font-family: system-ui, sans-serif;
    }
    header, main, footer {
      width: min(900px, 90%);
      margin: auto;
    }
    header {
      padding: 28px 0;
      border-bottom: 1px solid #252d38;
      color: #42f5a5;
      font-weight: 700;
      letter-spacing: 2px;
    }
    main { padding: 100px 0; }
    .tag { color: #42f5a5; }
    h1 {
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1.05;
      margin: 18px 0;
    }
    p { color: #aab6c7; line-height: 1.8; }
    a {
      color: #42f5a5;
      text-decoration: none;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border: 1px solid #42f5a5;
      border-radius: 8px;
    }
    footer {
      border-top: 1px solid #252d38;
      padding: 24px 0;
      color: #8491a3;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>YAVIN.BLOG</header>
  <main>
    <span class="tag">PERSONAL SPACE / 001</span>
    <h1>Ideas become<br><span class="tag">reality.</span></h1>
    <p>
      Selamat datang di website saya.
      Ini adalah awal dari sesuatu yang baru.
    </p>
    <a class="button" href="mailto:hello@yavin.blog">
      Hubungi saya ↗
    </a>
  </main>
  <footer>© 2026 Yavin Blog · Dibuat dengan kreativitas.</footer>
</body>
</html>
